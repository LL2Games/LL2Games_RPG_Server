name: Server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux Build and Packet Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-libmysqlclient-dev \
            libhiredis-dev \
            nlohmann-json3-dev

      - name: Build all servers
        run: make -C SERVER

      - name: Run packet parser test
        run: make -C Test packet-test