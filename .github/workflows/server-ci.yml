name: 서버 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux 서버 빌드 및 전체 회귀 테스트
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: game_test
          MYSQL_USER: game_test_user
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: 3306
      TEST_MYSQL_USER: game_test_user
      TEST_MYSQL_PASSWORD: ci_test_password
      TEST_MYSQL_DATABASE: game_test

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 빌드 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-libmysqlclient-dev \
            libhiredis-dev \
            nlohmann-json3-dev

      - name: 전체 서버 빌드
        run: make -C SERVER

      - name: 전체 회귀 및 통합 테스트
        run: make -C SERVER test
        